<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A1E1B"/>
      <stop offset="30%" stop-color="#8C3A27"/>
      <stop offset="60%" stop-color="#D26938"/>
      <stop offset="85%" stop-color="#E8A058"/>
      <stop offset="100%" stop-color="#F4C880"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF1CE"/>
      <stop offset="100%" stop-color="#F7C268"/>
    </linearGradient>
    <linearGradient id="dune1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C86A34"/>
      <stop offset="100%" stop-color="#E59654"/>
    </linearGradient>
    <linearGradient id="dune2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A64D22"/>
      <stop offset="100%" stop-color="#C26A32"/>
    </linearGradient>
    <linearGradient id="dune3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7A3215"/>
      <stop offset="100%" stop-color="#9E4B21"/>
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- Glowing Sun -->
  <circle cx="400" cy="280" r="120" fill="url(#sun)" opacity="0.85"/>

  <!-- Distant Atlas Mountains -->
  <polygon points="0,360 120,240 220,310 380,190 520,320 660,210 800,350 800,500 0,500" fill="#5A231C" opacity="0.75"/>
  <polygon points="120,240 150,270 180,250 220,310" fill="#FFF1CE" opacity="0.2"/>
  <polygon points="380,190 410,230 450,210 520,320" fill="#FFF1CE" opacity="0.25"/>
  <polygon points="660,210 685,245 710,230 800,350" fill="#FFF1CE" opacity="0.2"/>

  <!-- Hot Air Balloon -->
  <g transform="translate(540, 90)">
    <!-- Balloon Body -->
    <path d="M 0 0 C -45 -50 -45 -100 0 -130 C 45 -100 45 -50 0 0 Z" fill="#D26938" stroke="#FAF2E6" stroke-width="3"/>
    <path d="M 0 0 C -25 -40 -25 -90 0 -130 C 25 -90 25 -40 0 0 Z" fill="#E8A058"/>
    <path d="M 0 0 C -10 -30 -10 -80 0 -130 C 10 -80 10 -30 0 0 Z" fill="#3D1D18"/>
    <!-- Stripes -->
    <path d="M -38 -70 C -20 -70 20 -70 38 -70" stroke="#FAF2E6" stroke-width="4" fill="none"/>
    <!-- Ropes & Basket -->
    <line x1="-12" y1="0" x2="-8" y2="18" stroke="#3D1D18" stroke-width="2"/>
    <line x1="12" y1="0" x2="8" y2="18" stroke="#3D1D18" stroke-width="2"/>
    <rect x="-12" y="18" width="24" height="16" rx="3" fill="#7A3215" stroke="#FAF2E6" stroke-width="1.5"/>
  </g>

  <!-- Small Distant Balloon -->
  <g transform="translate(220, 140) scale(0.45)">
    <path d="M 0 0 C -45 -50 -45 -100 0 -130 C 45 -100 45 -50 0 0 Z" fill="#E8A058"/>
    <rect x="-10" y="15" width="20" height="14" rx="2" fill="#3D1D18"/>
  </g>

  <!-- Sahara Sand Dunes Layer 1 -->
  <path d="M -20 380 Q 200 300 450 370 T 820 340 L 820 500 L -20 500 Z" fill="url(#dune1)"/>

  <!-- Sahara Sand Dunes Layer 2 -->
  <path d="M -20 410 Q 280 340 550 420 T 820 390 L 820 500 L -20 500 Z" fill="url(#dune2)"/>

  <!-- Camel Caravan Silhouette on Dune Ridge -->
  <g fill="#2A100B" transform="translate(180, 318) scale(0.65)">
    <!-- Camel 1 -->
    <path d="M 20 20 C 10 10 0 15 0 25 C 0 30 10 32 12 40 L 10 60 L 15 60 L 18 45 L 28 45 L 30 60 L 35 60 L 32 38 L 40 38 L 42 60 L 47 60 L 45 35 C 50 30 45 15 35 15 C 30 15 25 18 20 20 Z"/>
    <!-- Camel 2 -->
    <path d="M 90 23 C 80 13 70 18 70 28 C 70 33 80 35 82 43 L 80 63 L 85 63 L 88 48 L 98 48 L 100 63 L 105 63 L 102 41 L 110 41 L 112 63 L 117 63 L 115 38 C 120 33 115 18 105 18 C 100 18 95 21 90 23 Z"/>
    <!-- Lead Person -->
    <path d="M -20 35 C -20 30 -15 25 -10 25 C -5 25 0 30 0 35 L -2 60 L -18 60 Z"/>
    <!-- Lead rope -->
    <line x1="-10" y1="35" x2="10" y2="25" stroke="#2A100B" stroke-width="2"/>
    <line x1="35" y1="25" x2="80" y2="28" stroke="#2A100B" stroke-width="2"/>
  </g>

  <!-- Foreground Dune -->
  <path d="M -20 440 Q 350 390 820 460 L 820 500 L -20 500 Z" fill="url(#dune3)"/>

  <!-- Foreground Palm Silhouettes -->
  <g fill="#1F0A06" transform="translate(710, 310)">
    <path d="M 25 180 Q 15 90 40 0 L 50 0 Q 30 90 35 180 Z"/>
    <!-- Palm fronds -->
    <path d="M 40 0 C 10 -30 -30 -20 -50 0 C -20 -10 20 -10 40 0 Z"/>
    <path d="M 40 0 C 60 -40 100 -30 120 -10 C 80 -10 50 -10 40 0 Z"/>
    <path d="M 40 0 C -10 -50 20 -80 40 -90 C 35 -50 38 -20 40 0 Z"/>
    <path d="M 40 0 C 80 -60 50 -90 40 -90 C 42 -50 40 -20 40 0 Z"/>
  </g>
</svg>