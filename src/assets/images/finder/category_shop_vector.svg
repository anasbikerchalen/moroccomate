<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="shop_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2C140E"/>
      <stop offset="50%" stop-color="#582315"/>
      <stop offset="100%" stop-color="#8A3C1B"/>
    </linearGradient>
    <linearGradient id="arch_gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E2B053"/>
      <stop offset="100%" stop-color="#9E6C1E"/>
    </linearGradient>
    <radialGradient id="lamp_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFEAA5" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#F3B338" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F3B338" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#shop_bg)"/>

  <!-- Ornate Souk Archway Frame -->
  <path d="M 50 500 L 50 180 C 50 70 200 30 400 30 C 600 30 750 70 750 180 L 750 500 Z" fill="none" stroke="url(#arch_gold)" stroke-width="16" opacity="0.4"/>
  <path d="M 80 500 L 80 200 C 80 100 220 60 400 60 C 580 60 720 100 720 200 L 720 500 Z" fill="none" stroke="#D18D34" stroke-width="6" opacity="0.6"/>

  <!-- Zellige Patterned Back Wall -->
  <g opacity="0.12" fill="#FFF1CE">
    <pattern id="zellige" width="40" height="40" patternUnits="userSpaceOnUse">
      <polygon points="20,0 40,20 20,40 0,20" fill="none" stroke="#FFF1CE" stroke-width="1.5"/>
      <circle cx="20" cy="20" r="6" fill="none" stroke="#FFF1CE" stroke-width="1.5"/>
    </pattern>
    <rect width="800" height="500" fill="url(#zellige)"/>
  </g>

  <!-- Glowing Brass Lanterns -->
  <!-- Center Main Lantern -->
  <circle cx="400" cy="150" r="90" fill="url(#lamp_glow)"/>
  <g transform="translate(400, 110)">
    <line x1="0" y1="-110" x2="0" y2="-30" stroke="#D18D34" stroke-width="3"/>
    <path d="M 0 -30 C -25 -10 -25 30 0 50 C 25 30 25 -10 0 -30 Z" fill="#E8AB3E" stroke="#3D1B0F" stroke-width="2"/>
    <polygon points="0,50 -12,70 12,70" fill="#D18D34"/>
    <circle cx="0" cy="10" r="8" fill="#FFF9E6"/>
  </g>
  <!-- Left Lantern -->
  <circle cx="220" cy="180" r="60" fill="url(#lamp_glow)" opacity="0.7"/>
  <g transform="translate(220, 150)">
    <line x1="0" y1="-150" x2="0" y2="-20" stroke="#D18D34" stroke-width="2"/>
    <path d="M 0 -20 C -18 -5 -18 20 0 35 C 18 20 18 -5 0 -20 Z" fill="#D18D34" stroke="#3D1B0F" stroke-width="2"/>
  </g>
  <!-- Right Lantern -->
  <circle cx="580" cy="180" r="60" fill="url(#lamp_glow)" opacity="0.7"/>
  <g transform="translate(580, 150)">
    <line x1="0" y1="-150" x2="0" y2="-20" stroke="#D18D34" stroke-width="2"/>
    <path d="M 0 -20 C -18 -5 -18 20 0 35 C 18 20 18 -5 0 -20 Z" fill="#D18D34" stroke="#3D1B0F" stroke-width="2"/>
  </g>

  <!-- Souk Display Tables & Shelves -->
  <!-- Handcrafted Moroccan Carpets (Hanging & Stacked) -->
  <g transform="translate(120, 220)">
    <!-- Hanging Berber Rug 1 -->
    <rect x="0" y="0" width="120" height="180" rx="4" fill="#9C2A1B" stroke="#FFF1CE" stroke-width="3"/>
    <path d="M 20 20 L 60 60 L 100 20 M 20 160 L 60 120 L 100 160" stroke="#F3B338" stroke-width="4" fill="none"/>
    <polygon points="60,70 80,90 60,110 40,90" fill="#225345"/>
    <!-- Fringes -->
    <line x1="10" y1="180" x2="10" y2="195" stroke="#FFF1CE" stroke-width="2"/>
    <line x1="30" y1="180" x2="30" y2="195" stroke="#FFF1CE" stroke-width="2"/>
    <line x1="50" y1="180" x2="50" y2="195" stroke="#FFF1CE" stroke-width="2"/>
    <line x1="70" y1="180" x2="70" y2="195" stroke="#FFF1CE" stroke-width="2"/>
    <line x1="90" y1="180" x2="90" y2="195" stroke="#FFF1CE" stroke-width="2"/>
    <line x1="110" y1="180" x2="110" y2="195" stroke="#FFF1CE" stroke-width="2"/>
  </g>

  <!-- Conical Spice Bowls (Pyramids) -->
  <g transform="translate(320, 340)">
    <!-- Brass Trays -->
    <ellipse cx="80" cy="90" rx="140" ry="30" fill="#8C591B" stroke="#E2B053" stroke-width="3"/>
    
    <!-- Saffron / Orange Spice Cone -->
    <polygon points="0,90 40,10 80,90" fill="#E57E25"/>
    <!-- Indigo Blue Spice Cone -->
    <polygon points="50,90 90,0 130,90" fill="#1B4965"/>
    <!-- Paprika Red Spice Cone -->
    <polygon points="100,90 140,15 180,90" fill="#A8201A"/>
    <!-- Cumin Yellow Spice Cone -->
    <polygon points="150,90 185,30 220,90" fill="#DDA15E"/>
  </g>

  <!-- Leather Babouche Slippers -->
  <g transform="translate(570, 310)">
    <!-- Hanging Rack -->
    <rect x="0" y="0" width="130" height="150" rx="6" fill="#1E4338" stroke="#E2B053" stroke-width="2"/>
    <!-- Slipper 1 (Yellow) -->
    <path d="M 20 30 C 20 15 40 10 55 25 C 65 35 50 50 20 50 Z" fill="#F4A261" stroke="#FFF" stroke-width="1.5"/>
    <!-- Slipper 2 (Red) -->
    <path d="M 70 30 C 70 15 90 10 105 25 C 115 35 100 50 70 50 Z" fill="#E63946" stroke="#FFF" stroke-width="1.5"/>
    <!-- Slipper 3 (Blue) -->
    <path d="M 20 80 C 20 65 40 60 55 75 C 65 85 50 100 20 100 Z" fill="#2A9D8F" stroke="#FFF" stroke-width="1.5"/>
    <!-- Slipper 4 (Gold) -->
    <path d="M 70 80 C 70 65 90 60 105 75 C 115 85 100 100 70 100 Z" fill="#E9C46A" stroke="#FFF" stroke-width="1.5"/>
  </g>

  <!-- Terracotta Pottery Bowls in Foreground -->
  <g transform="translate(220, 410)">
    <ellipse cx="40" cy="40" rx="45" ry="20" fill="#9C4121" stroke="#FAF2E6" stroke-width="2"/>
    <ellipse cx="40" cy="35" rx="38" ry="14" fill="#1D4E41"/>
  </g>
</svg>